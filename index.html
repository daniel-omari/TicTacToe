<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
    </head>
<body>
    <!-- Game mode selection UI-->
    <div id="menu-screen">
        <h1 id="title">Tic-Tac-Toe</h1>
        <p>Select a game mode:</p>
        <button class="menu-button" id="ai">Play VS AI</button>
        <button class="menu-button" id="online">Play Online</button>
        <button class="menu-button" id="offline">Play Offline</button>
        <button class="menu-button" id="viewLeaderboard">Online Leaderboard</button>
    </div>

    <!-- AI difficulty selection-->
    <div id="ai-mode-selection" style="display: none;">
        <button class="menu-button" id="aiEasy">Naive</button>
        <button class="menu-button" id="aiMedium">Intermediate</button>
        <button class="menu-button" id="aiHard">Advanced</button>
    </div>

    <!-- PVP and Offline game -->
    <div class="game-container" id="game-container" style="display: none;">
        <h1 id="title">Tic-Tac-Toe</h1>
        <p class="about">Tic-Tac-Toe is a classic game of strategy played on a 3x3 grid. The goal is to align three symbols in a row, either horizontally, vertically, or diagonally.</p>
        <div class="board" role="grid" aria-label="Tic-Tac-Toe board">
            <div class="row" role="row">
                <button class="square" id="0" role="gridcell" aria-label="Empty cell"></button>
                <button class="square" id="1" role="gridcell" aria-label="Empty cell"></button>
                <button class="square" id="2" role="gridcell" aria-label="Empty cell"></button>
            </div>
            <div class="row" role="row">
                <button class="square" id="3" role="gridcell" aria-label="Empty cell"></button>
                <button class="square" id="4" role="gridcell" aria-label="Empty cell"></button>
                <button class="square" id="5" role="gridcell" aria-label="Empty cell"></button>
            </div>
            <div class="row" role="row">
                <button class="square" id="6" role="gridcell" aria-label="Empty cell"></button>
                <button class="square" id="7" role="gridcell" aria-label="Empty cell"></button>
                <button class="square" id="8" role="gridcell" aria-label="Empty cell"></button>
            </div>
        </div>

        <div class="game-info">
            <p id="playerIndicator"></p>
            <p id="status">Player X's turn</p>
            <button id="reset" aria-label="Reset game">Reset Game</button>
            <button id="menu" aria-label="Back to the main menu">Menu</button>
        </div>
        <div id="endGameMessage" style="display:none;"></div>
    </div>

    <!-- Leaderboard -->
     <div id="leaderboard" style="display: none;">
        <h2 id="ldTitle">Leaderboard</h2>
        <ul id="leaderboardList" role="list" aria-live="polite"></ul>
     </div>


    <script src="ticTacToe.js"></script>
</body>
</html>
